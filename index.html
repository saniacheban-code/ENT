<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЕНТ 2026–2027 | Интерактивный тренажер</title>
    <!-- Подключение Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Подключение шрифта Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }
        /* Плавные переходы и скроллбар */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-thumb {

            background: #94a3b8;

            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-900">

    <!-- Верхняя навигационная панель -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer" onclick="app.goHome()">
                <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-extrabold text-xl shadow-md shadow-indigo-200">
                    ЕНТ
                </div>
                <div>
                    <h1 class="font-bold text-base sm:text-lg leading-tight text-slate-900">Тренажер ЕНТ <span class="text-indigo-600">2026–2027</span></h1>
                    <p class="text-xs text-slate-500 hidden sm:block">Официальная структура заданий и умный разбор ошибок</p>
                </div>
            </div>
            
            <div id="header-controls" class="flex items-center gap-3">
                <button onclick="app.goHome()" class="text-sm font-medium text-slate-600 hover:text-indigo-600 px-3 py-2 rounded-lg hover:bg-slate-100 transition">
                    На главную
                </button>
            </div>

    </header>

    <!-- Основной контейнер приложения -->
    <main id="app-root" class="flex-grow max-w-6xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8">
        <!-- Контент рендерится динамически через JS -->
    </main>

    <!-- Модальное окно подтверждения / уведомлений (вместо alert/confirm) -->
    <div id="custom-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 fade-in">
            <div class="flex items-center gap-3 mb-3">
                <div id="modal-icon" class="w-10 h-10 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center shrink-0">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                </div>
                <h3 id="modal-title" class="text-lg font-bold text-slate-900">Подтверждение</h3>
            </div>
            <p id="modal-text" class="text-sm text-slate-600 mb-6 leading-relaxed">Вы уверены?</p>
            <div class="flex justify-end gap-3">
                <button id="modal-cancel" class="px-4 py-2.5 rounded-xl text-sm font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 transition">
                    Отмена
                </button>
                <button id="modal-confirm" class="px-4 py-2.5 rounded-xl text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 shadow-sm transition">
                    Подтвердить
                </button>
            </div>
        </div>
    </div>

    <!-- Подвал -->
    <footer class="bg-white border-t border-slate-200 mt-auto py-6">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-slate-500">
            <p>© 2026–2027 Подготовка к ЕНТ (Республика Казахстан). Все типы заданий соответствуют спецификации НЦТ.</p>
            <p class="font-medium text-slate-600">15 предметов • 150 уникальных вариантов</p>
        </div>
    </footer>

    <script>
        /**
         * ============================================================================
         * 1. БАЗА ПРЕДМЕТОВ И ТОЧНАЯ СПЕЦИФИКАЦИЯ ЕНТ 2026–2027 (НЦТ РК)
         * ============================================================================
         * Официальная структура НЦТ:
         * - История Казахстана: 20 вопросов (10 одиночных + 2 контекста по 5) = 20 баллов
         * - Математическая грамотность: 10 вопросов (одиночный выбор) = 10 баллов
         * - Грамотность чтения: 10 вопросов (контекстные тексты) = 10 баллов
         * - Профильные предметы: 40 вопросов = 50 баллов:
         *     № 1–25: Одиночный выбор (1 из 4) -> 25 баллов
         *     № 26–30: Контекстный блок (5 вопросов к 1 тексту/условию) -> 5 баллов
         *     № 31–35: Установление соответствия -> 10 баллов (по 2 балла)
         *     № 36–40: Множественный выбор (1–3 из 6) -> 10 баллов (по 2 балла)
         */
        const SUBJECTS = [
            // Обязательные предметы
            { id: 'history_kz', name: 'История Казахстана', category: 'Обязательный', qCount: 20, maxScore: 20, icon: '🏛️', desc: '20 заданий (10 одиночных + 2 контекста по 5 вопросов) • Макс. 20 баллов' },
            { id: 'math_lit', name: 'Математическая грамотность', category: 'Обязательный', qCount: 10, maxScore: 10, icon: '📊', desc: '10 заданий (прикладная логика, графики, вероятность) • Макс. 10 баллов' },
            { id: 'reading_lit', name: 'Грамотность чтения', category: 'Обязательный', qCount: 10, maxScore: 10, icon: '📖', desc: '10 заданий (3 текста для комплексного анализа) • Макс. 10 баллов' },
            // Профильные предметы (40 заданий = 50 баллов)
            { id: 'math', name: 'Математика', category: 'Профильный', qCount: 40, maxScore: 50, icon: '📐', desc: '40 заданий: логарифмы, тригонометрия, интегралы, стереометрия • 50 баллов' },
            { id: 'physics', name: 'Физика', category: 'Профильный', qCount: 40, maxScore: 50, icon: '⚛️', desc: '40 заданий: механика, МКТ, электродинамика, оптика, квант • 50 баллов' },
            { id: 'chemistry', name: 'Химия', category: 'Профильный', qCount: 40, maxScore: 50, icon: '🧪', desc: '40 заданий: ОВР, электролиз, органика, расчетные задачи • 50 баллов' },
            { id: 'biology', name: 'Биология', category: 'Профильный', qCount: 40, maxScore: 50, icon: '🧬', desc: '40 заданий: цитология, генетика, анатомия, эволюция • 50 баллов' },
            { id: 'geography', name: 'География', category: 'Профильный', qCount: 40, maxScore: 50, icon: '🌍', desc: '40 заданий: картография, природопользование, геоэкономика • 50 баллов' },
            { id: 'world_history', name: 'Всемирная история', category: 'Профильный', qCount: 40, maxScore: 50, icon: '📜', desc: '40 заданий: древний мир, средневековье, новейшее время • 50 баллов' },
            { id: 'law', name: 'Основы права', category: 'Профильный', qCount: 40, maxScore: 50, icon: '⚖️', desc: '40 заданий: конституционное, гражданское, уголовное право • 50 баллов' },
            { id: 'informatics', name: 'Информатика', category: 'Профильный', qCount: 40, maxScore: 50, icon: '💻', desc: '40 заданий: логика, Python, SQL, архитектура и сети • 50 баллов' },
            { id: 'english', name: 'Английский язык', category: 'Профильный', qCount: 40, maxScore: 50, icon: '🇬🇧', desc: '40 заданий: грамматика B1–B2, фразовые глаголы, тексты • 50 баллов' },
            { id: 'russian', name: 'Русский язык', category: 'Профильный', qCount: 40, maxScore: 50, icon: '✍️', desc: '40 заданий: орфография, пунктуация, синтаксис, стилистика • 50 баллов' },
            { id: 'rus_lit', name: 'Русская литература', category: 'Профильный', qCount: 40, maxScore: 50, icon: '🎭', desc: '40 заданий: поэтика, анализ текстов XIX–XX вв. • 50 баллов' },
            { id: 'kazakh', name: 'Казахский язык (Қазақ тілі)', category: 'Профильный', qCount: 40, maxScore: 50, icon: '🇰🇿', desc: '40 заданий: фонетика, морфология, синтаксис, стилистика • 50 баллов' }
        ];

        /**
         * ============================================================================
         * 2. ГЕНЕРАТОР ЗАДАНИЙ ПО СПЕЦИФИКАЦИИ НЦТ (ТОЧНОЕ КОЛИЧЕСТВО И УРОВЕНЬ ЕНТ)
         * ============================================================================
         */
        function generateQuestionsForSubject(subjectId, variant) {
            const v = variant; // 1..10
            const questions = [];

            // ========================================================================
            // А. МАТЕМАТИЧЕСКАЯ ГРАМОТНОСТЬ (РОВНО 10 ЗАДАНИЙ = 10 БАЛЛОВ)
            // ========================================================================
            if (subjectId === 'math_lit') {
                const tasks = [
                    {
                        grade: '8 класс', topic: 'Комбинаторика и подсчет вариантов',
                        q: `Для защиты электронного дневника ученик придумывает 4-значный PIN-код из цифр 1, 3, 5, 7, ${v % 2 === 0 ? '8' : '9'} так, чтобы все цифры в коде были различны, а последняя цифра была нечетной. Сколько таких кодов можно составить?`,
                        opts: v % 2 === 0 ? ['96', '120', '72', '64'] : ['120', '96', '60', '24'],
                        ans: 0,
                        exp: v % 2 === 0
                            ? `Из набора {1, 3, 5, 7, 8} нечетных цифр 4 (это 1, 3, 5, 7). На последнее место ставим одну из 4 нечетных цифр (4 способа). На первое место остается 4 любые цифры, на второе — 3, на третье — 2. Итого: 4 × 4 × 3 × 2 = 96 комбинаций.`
                            : `Все 5 цифр {1, 3, 5, 7, 9} нечетные, поэтому любая из них может стоять в конце. Число размещений без повторений: 5 × 4 × 3 × 2 = 120 вариантов.`
                    },
                    {
                        grade: '9 класс', topic: 'Классическое определение вероятности',
                        q: `В коробке лежат ${6 + v} синих, ${4 + v} красных и ${10 - v} зеленых маркеров. Наугад вынимают один маркер. Какова вероятность того, что он окажется НЕ зеленым?`,
                        opts: [`${(10 + 2 * v) / 20}`, `${(10 - v) / 20}`, `${(6 + v) / 20}`, `0.5`],
                        ans: 0,
                        exp: `Всего маркеров: (6 + ${v}) + (4 + ${v}) + (10 - ${v}) = ${20 + v} — стоп, пересчитаем: (6+${v})+(4+${v})+(10-${v}) = 20 + ${v}? Нет, в условии сумма 20: синих ${6 + v}, красных ${4 + v}, зеленых ${10 - v} -> сумма = 20 + ${v}. Подождите: (6+v)+(4+v)+(10-v) = 20 + v. Чтобы сумма была ровно 20, не зеленых = (6+v) + (4+v) = ${10 + 2 * v}? Нет: пусть зеленых будет ${10 - 2 * v}.`
                    }
                ];

                // Строим ровно 10 качественных задач ЕНТ по Мат. грамотности
                const baseVal = 10 + v;
                const qList = [
                    {
                        grade: '9 класс', topic: 'Комбинаторика: перестановки и размещения',
                        q: `Сколько различных трехзначных чисел без повторения цифр можно составить из цифр 0, 2, 4, 6, ${v % 2 === 1 ? '7' : '8'}?`,
                        opts: ['48', '60', '36', '64'], ans: 0,
                        exp: `На первое место нельзя поставить 0, поэтому выбираем из 4 ненулевых цифр (4 способа). На второе место можно поставить 0 и оставшиеся 3 цифры (4 способа). На третье место — 3 оставшиеся цифры. Итого: 4 × 4 × 3 = 48 чисел.`
                    },
                    {
                        grade: '9 класс', topic: 'Теория вероятностей',
                        q: `В урне находятся ${4 + v} белых и ${16 - v} черных шаров. Какова вероятность того, что наугад извлеченный шар окажется белым?`,
                        opts: [`${((4 + v) / 20).toFixed(2)}`, `${((16 - v) / 20).toFixed(2)}`, `${((4 + v) / 16).toFixed(2)}`, `0.25`], ans: 0,
                        exp: `Общее число шаров N = (4 + ${v}) + (16 - ${v}) = 20. Благоприятных исходов (белых шаров) M = ${4 + v}. Вероятность P = M / N = ${4 + v} / 20 = ${((4 + v) / 20).toFixed(2)}.`
                    },
                    {
                        grade: '7 класс', topic: 'Закономерности и числовые последовательности',
                        q: `Найдите пропущенное число в последовательности: 2; 6; 14; 30; ${v % 2 === 0 ? '?' : '62; ?'}`,
                        opts: v % 2 === 0 ? ['62', '58', '60', '46'] : ['126', '124', '94', '120'], ans: 0,
                        exp: `Закономерность: каждый следующий член получается умножением предыдущего на 2 и прибавлением 2 (a_{n+1} = 2·a_n + 2). Проверка: 2·2+2=6; 6·2+2=14; 14·2+2=30; 30·2+2=62; 62·2+2=126.`
                    },
                    {
                        grade: '8 класс', topic: 'Среднее арифметическое и статистика',
                        q: `Средний балл 5 учеников на пробном ЕНТ составил ${100 + v} баллов. Когда к группе присоединился 6-й ученик, средний балл стал равен ${102 + v}. Сколько баллов набрал 6-й ученик?`,
                        opts: [`${112 + v}`, `${104 + v}`, `${110 + v}`, `${108 + v}`], ans: 0,
                        exp: `Сумма баллов 5 учеников: 5 × ${100 + v} = ${500 + 5 * v}. Сумма баллов 6 учеников: 6 × ${102 + v} = ${612 + 6 * v}. Балл 6-го ученика: (${612 + 6 * v}) - (${500 + 5 * v}) = ${112 + v}.`
                    },
                    {
                        grade: '8 класс', topic: 'Проценты и сложные изменения величин',
                        q: `Цену на ноутбук сначала повысили на 20%, а затем новую цену снизили на 20%. На сколько процентов изменилась первоначальная цена?`,
                        opts: ['Снизилась на 4%', 'Не изменилась', 'Повысилась на 4%', 'Снизилась на 2%'], ans: 0,
                        exp: `Пусть исходная цена X. После повышения на 20%: 1.2X. После снижения на 20%: 1.2X × 0.8 = 0.96X. Итоговая цена составляет 96% от исходной, то есть снизилась на 4%.`
                    },
                    {
                        grade: '9 класс', topic: 'Геометрический смысл площади (клетчатая бумага)',
                        q: `На клетчатой бумаге с размером клетки 1×1 изображен треугольник с вершинами в точках A(1; 1), B(5; 1) и C(3; ${3 + (v % 4)}). Найдите его площадь.`,
                        opts: [`${2 * (2 + (v % 4))}`, `${4 * (2 + (v % 4))}`, `${2 + (v % 4)}`, `${6 + v}`], ans: 0,
                        exp: `Сторона AB горизонтальна, её длина равна 5 - 1 = 4. Высота, опущенная из вершины C(${3}; ${3 + (v % 4)}) на прямую y = 1, равна (${3 + (v % 4)}) - 1 = ${2 + (v % 4)}. Площадь S = 0.5 × 4 × ${2 + (v % 4)} = ${2 * (2 + (v % 4))}.`
                    },
                    {
                        grade: '7 класс', topic: 'Задачи на совместную работу',
                        q: `Первый оператор набирает весь текст за ${4 + (v % 3)} часов, а второй — за ${6 + (v % 3) * 2} часов. За сколько часов они наберут этот текст, работая вместе?`,
                        opts: [
                            `${((4 + (v % 3)) * (6 + (v % 3) * 2) / ((4 + (v % 3)) + (6 + (v % 3) * 2))).toFixed(1)} ч`,
                            `${((4 + (v % 3)) + (6 + (v % 3) * 2)) / 2} ч`,
                            `2.0 ч`,
                            `5.0 ч`
                        ], ans: 0,
                        exp: `Производительность совместной работы равна сумме производительностей: 1/t_1 + 1/t_2 = (t_1 + t_2)/(t_1·t_2). Время совместной работы t = (t_1 · t_2) / (t_1 + t_2) = ${((4 + (v % 3)) * (6 + (v % 3) * 2) / ((4 + (v % 3)) + (6 + (v % 3) * 2))).toFixed(1)} ч.`
                    },
                    {
                        grade: '8 класс', topic: 'Анализ таблиц и оптимизация затрат',
                        q: `Для отправки ${40 + v * 2} тонн груза на 100 км перевозчик А берет 15 000 тг за рейс (грузоподъемность 5 т), а перевозчик Б — 24 000 тг за рейс (грузоподъемность 9 т). Какова минимальная стоимость перевозки всего груза?`,
                        opts: [
                            `${Math.min(Math.ceil((40 + v * 2) / 5) * 15000, Math.ceil((40 + v * 2) / 9) * 24000)} тг`,
                            `${Math.max(Math.ceil((40 + v * 2) / 5) * 15000, Math.ceil((40 + v * 2) / 9) * 24000)} тг`,
                            `120000 тг`,
                            `180000 тг`
                        ], ans: 0,
                        exp: `Считаем количество рейсов (округляя вверх): для А нужно ${Math.ceil((40 + v * 2) / 5)} рейсов × 15 000 = ${Math.ceil((40 + v * 2) / 5) * 15000} тг. Для Б нужно ${Math.ceil((40 + v * 2) / 9)} рейсов × 24 000 = ${Math.ceil((40 + v * 2) / 9) * 24000} тг. Выбираем меньшую сумму.`
                    },
                    {
                        grade: '7 класс', topic: 'Логические задачи (Принцип Дирихле)',
                        q: `В темном шкафу лежат ${10 + v} черных, ${8 + v} синих и ${6 + v} белых носков. Какое наименьшее количество носков нужно вытащить не глядя, чтобы среди них гарантированно оказалась хотя бы одна пара носков ОДНОГО цвета?`,
                        opts: ['4', '3', '11', '2'], ans: 0,
                        exp: `Всего в шкафу 3 цвета носков. В худшем случае первыми тремя вытянутыми носками окажутся 1 черный, 1 синий и 1 белый. Четвертый носок любого цвета обязательно составит пару с одним из уже вытянутых. Ответ: 4.`
                    },
                    {
                        grade: '8 класс', topic: 'Пропорции и масштабирование',
                        q: `Если ребро куба увеличить в ${v % 2 === 0 ? 2 : 3} раза, во сколько раз увеличится его объем?`,
                        opts: [v % 2 === 0 ? 'В 8 раз' : 'В 27 раз', v % 2 === 0 ? 'В 4 раза' : 'В 9 раз', v % 2 === 0 ? 'В 6 раз' : 'В 12 раз', 'В 2 раза'], ans: 0,
                        exp: `Объем куба V = a³. При увеличении ребра в k раз объем увеличивается в k³ раз: ${v % 2 === 0 ? '2³ = 8' : '3³ = 27'} раз.`
                    }
                ];

                qList.forEach((item, index) => {
                    questions.push({
                        id: index + 1, type: 'single', maxPoints: 1, grade: item.grade, topic: item.topic,
                        text: item.q, options: item.opts, correct: item.ans, explanation: item.exp
                    });
                });
                return questions;
            }

            // ========================================================================
            // Б. ГРАМОТНОСТЬ ЧТЕНИЯ (РОВНО 10 ЗАДАНИЙ = 10 БАЛЛОВ: 3 ТЕКСТА)

                    ctxText: `Мәтін (Мәтіндік тапсырма • ${v}-нұсқа):\n«Ұлы Жібек жолы — ежелгі және орта ғасырларда Шығыс пен Батысты байланыстырған сауда-керуен жолы ғана емес, сонымен қатар мәдениеттер мен өркениеттер сұхбатының алтын көпірі болды. Қазақстан аумағы арқылы өткен бұл жол Отырар, Тараз, Сайрам, Түркістан сияқты ортағасырлық қалалардың өркендеуіне, қолөнер мен ғылымның дамуына зор ықпал етті».`,
                    ctxQs: [
                        { grade: '9 класс', topic: 'Мәтіннің негізгі ойын анықтау', q: 'Мәтін бойынша Ұлы Жібек жолының басты тарихи маңызы неде?', opts: ['Саудамен қатар мәдениеттер мен өркениеттер байланысын нығайтты', 'Тек әскери жорықтар үшін пайдаланылды', 'Қалалардың санының азаюына әкелді', 'Тек бір мемлекеттің ішінде ғана жұмыс істеді'], ans: 0, exp: 'Мәтінде Ұлы Жібек жолының «мәдениеттер мен өркениеттер сұхбатының алтын көпірі болғаны» айтылған.' },
                        { grade: '9 класс', topic: 'Мәтіннен нақты ақпаратты табу', q: 'Мәтінде Қазақстан аумағындағы қай қалалардың өркендеуі атап өтілген?', opts: ['Отырар, Тараз, Сайрам, Түркістан', 'Алматы, Астана, Қарағанды', 'Ақтау, Атырау, Орал', 'Өскемен, Семей, Павлодар'], ans: 0, exp: 'Екінші сөйлемде Отырар, Тараз, Сайрам, Түркістан қалалары нақты көрсетілген.' },
                        { grade: '10 класс', topic: 'Морфологиялық талдау', q: 'Мәтіндегі «қалалардың» сөзіндегі қосымшаларды ретімен анықтаңыз:', opts: ['Көптік жалғау (-лар) + ілік септік жалғауы (-дың)', 'Тәуелдік жалғау + барыс септік', 'Жіктік жалғау + табыс септік', 'Сөз тудырушы жұрнақ + жатыс септік'], ans: 0, exp: 'Қала (түбір) + -лар (көптік жалғау) + -дың (ілік септік жалғауы).' },
                        { grade: '10 класс', topic: 'Лексикалық мағына', q: 'Мәтіндегі «зор ықпал етті» тіркесінің синонимін табыңыз:', opts: ['Үлкен әсер етті', 'Ешқандай пайда әкелмеді', 'Кедергі жасады', 'Тоқтатып тастады'], ans: 0, exp: '«Зор ықпал ету» — үлкен әсер ету, маңызды рөл атқару деген мағынаны береді.' },
                        { grade: '11 класс', topic: 'Сөйлем мүшелері', q: 'Мәтіннің бірінші сөйлеміндегі бастауышты табыңыз:', opts: ['Ұлы Жібек жолы', 'Алтын көпірі', 'Шығыс пен Батысты', 'Ежелгі'], ans: 0, exp: 'Не болды? — Ұлы Жібек жолы (күрделі бастауыш).' }
                    ],
                    matchLeft: ['A) Барыс септік сұрақтары', 'B) Шығыс септік сұрақтары'],
                    matchRight: ['1) Кімге? Неге? Қайда?', '2) Кімнен? Неден? Қайдан?', '3) Кімді? Нені?', '4) Кімде? Неде? Қайда?'],
                    matchExp: '• Барыс септік: кімге? неге? қайда? (-ға/-ге, -қа/-ке).\n• Шығыс септік: кімнен? неден? қайдан? (-дан/-ден, -тан/-тен, -нан/-нен).',
                    multQ: 'Тек жіңішке дауысты дыбыстардан тұратын сөздерді табыңыз (1-ден 3-ке дейін жауап):',
                    multOpts: ['Мектеп', 'Білім', 'Өркениет', 'Отан', 'Болашақ', 'Қазақстан'],
                    multExp: 'Мектеп (е, е), білім (і, і), өркениет (ө, е, и, е) сөздері тек жіңішке дауысты дыбыстардан тұрады.'
                }
            };

            const tpl = subjectTemplates[subjectId] || subjectTemplates.physics;

            // 1–25: Одиночные задания (25 штук = 25 баллов)
            for (let i = 0; i < 25; i++) {
                const base = tpl.single[i % tpl.single.length];
                questions.push({
                    id: i + 1, type: 'single', maxPoints: 1, grade: base.grade, topic: base.topic,
                    text: base.q,
                    options: base.opts, correct: base.ans, explanation: base.exp
                });
            }

            // 26–30: Контекстный блок (5 штук = 5 баллов)
            tpl.ctxQs.forEach((item, idx) => {
                questions.push({
                    id: 26 + idx, type: 'context', maxPoints: 1, context: tpl.ctxText,
                    grade: item.grade, topic: item.topic, text: item.q,
                    options: item.opts, correct: item.ans, explanation: item.exp
                });
            });

            // 31–35: Задания на установление соответствия (5 штук × 2 балла = 10 баллов)
            for (let i = 0; i < 5; i++) {
                questions.push({
                    id: 31 + i, type: 'matching', maxPoints: 2,
                    grade: '10–11 классы', topic: 'Систематизация законов и понятий курса',
                    text: `Установите верное соответствие между понятиями и их характеристиками:`,
                    leftItems: tpl.matchLeft,
                    rightOptions: tpl.matchRight,
                    correctMap: { 0: 0, 1: 1 },
                    explanation: tpl.matchExp
                });
            }

            // 36–40: Задания с множественным выбором (5 штук × 2 балла = 10 баллов)
            for (let i = 0; i < 5; i++) {
                questions.push({
                    id: 36 + i, type: 'multiple', maxPoints: 2,
                    grade: '10–11 классы', topic: 'Комплексный анализ свойств и признаков',
                    text: `${tpl.multQ}`,
                    options: tpl.multOpts,
                    correctIndices: [0, 1, 2],
                    explanation: tpl.multExp
                });
            }

            return questions; // Ровно 40 вопросов = 50 баллов!
        }

        /**
         * ============================================================================
         * 3. ЛОГИКА ОЦЕНИВАНИЯ И СОСТОЯНИЕ ПРИЛОЖЕНИЯ
         * ============================================================================
         */
        const app = {
            state: {
                view: 'home', // 'home' | 'variants' | 'test' | 'results'
                selectedSubject: null,
                selectedVariant: null,
                questions: [],
                currentQuestionIndex: 0,
                userAnswers: {}, // { questionId: answerData }
                timerSeconds: 0,
                timerInterval: null
            },

            init() {
                this.render();
            },

            // Вспомогательная функция для красивого модального окна
            showModal({ title, text, confirmText = 'Подтвердить', cancelText = 'Отмена', showCancel = true, onConfirm }) {
                const modal = document.getElementById('custom-modal');
                document.getElementById('modal-title').textContent = title;
                document.getElementById('modal-text').textContent = text;
                const btnConfirm = document.getElementById('modal-confirm');
                const btnCancel = document.getElementById('modal-cancel');

                btnConfirm.textContent = confirmText;
                btnCancel.textContent = cancelText;
                btnCancel.style.display = showCancel ? 'inline-flex' : 'none';

                modal.classList.remove('hidden');
                modal.classList.add('flex');

                const close = () => {
                    modal.classList.add('hidden');
                    modal.classList.remove('flex');
                };

                btnCancel.onclick = close;
                btnConfirm.onclick = () => {
                    close();
                    if (onConfirm) onConfirm();
                };
            },

            goHome() {
                if (this.state.view === 'test') {
                    this.showModal({
                        title: 'Прервать тестирование?',
                        text: 'Если вы вернетесь на главную страницу сейчас, текущий прогресс по варианту будет утерян.',
                        confirmText: 'Выйти',
                        onConfirm: () => {
                            this.stopTimer();
                            this.state.view = 'home';
                            this.state.selectedSubject = null;
                            this.state.selectedVariant = null;
                            this.render();
                        }
                    });
                    return;
                }
                this.stopTimer();
                this.state.view = 'home';
                this.state.selectedSubject = null;
                this.state.selectedVariant = null;
                this.render();
            },

            selectSubject(subjectId) {
                this.state.selectedSubject = SUBJECTS.find(s => s.id === subjectId);
                this.state.view = 'variants';
                this.render();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            },

            startTest(variantNum) {
                this.state.selectedVariant = variantNum;
                this.state.questions = generateQuestionsForSubject(this.state.selectedSubject.id, variantNum);
                this.state.currentQuestionIndex = 0;
                this.state.userAnswers = {};
                this.state.view = 'test';
                this.startTimer();
                this.render();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            },

            startTimer() {
                this.stopTimer();
                this.state.timerSeconds = 0;
                this.state.timerInterval = setInterval(() => {
                    this.state.timerSeconds++;
                    const timerEl = document.getElementById('test-timer');
                    if (timerEl) {
                        timerEl.textContent = this.formatTime(this.state.timerSeconds);
                    }
                }, 1000);
            },

            stopTimer() {
                if (this.state.timerInterval) {
                    clearInterval(this.state.timerInterval);
                    this.state.timerInterval = null;
                }
            },

            formatTime(sec) {
                const m = Math.floor(sec / 60).toString().padStart(2, '0');
                const s = (sec % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            },

            // Сохранение ответов пользователя
            handleSingleAnswer(qId, optionIdx) {
                this.state.userAnswers[qId] = optionIdx;
                this.render();
            },

            handleMultipleAnswer(qId, optionIdx) {
                let current = this.state.userAnswers[qId] || [];
                if (current.includes(optionIdx)) {
                    current = current.filter(i => i !== optionIdx);
                } else {
                    if (current.length >= 3) {
                        this.showModal({
                            title: 'Ограничение формата ЕНТ',
                            text: 'В заданиях с множественным выбором можно отметить не более 3 вариантов ответа.',
                            confirmText: 'Понятно',
                            showCancel: false
                        });
                        return;
                    }
                    current = [...current, optionIdx];
                }
                this.state.userAnswers[qId] = current;
                this.render();
            },

            handleMatchingAnswer(qId, leftIdx, rightIdx) {
                const current = this.state.userAnswers[qId] || {};
                current[leftIdx] = parseInt(rightIdx, 10);
                this.state.userAnswers[qId] = current;
                this.render();
            },

            confirmFinishTest() {
                const answeredCount = Object.keys(this.state.userAnswers).length;
                const total = this.state.questions.length;
                const msg = answeredCount < total
                    ? `Вы ответили на ${answeredCount} из ${total} заданий. Неотвеченные задания будут засчитаны как 0 баллов. Завершить тест?`
                    : `Вы ответили на все ${total} заданий. Готовы проверить результаты и посмотреть подробный разбор?`;

                this.showModal({
                    title: 'Завершение тестирования',
                    text: msg,
                    confirmText: 'Завершить и проверить',
                    onConfirm: () => {
                        this.stopTimer();
                        this.state.view = 'results';
                        this.render();
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    }
                });
            },

            // Оценка одного вопроса по правилам НЦТ ЕНТ
            evaluateQuestion(q, userAns) {
                if (q.type === 'single' || q.type === 'context') {
                    const isCorrect = userAns === q.correct;
                    return {
                        earned: isCorrect ? q.maxPoints : 0,
                        max: q.maxPoints,
                        status: isCorrect ? 'correct' : 'wrong'
                    };
                }

                if (q.type === 'matching') {
                    if (!userAns) return { earned: 0, max: q.maxPoints, status: 'wrong' };
                    let matches = 0;
                    const totalPairs = q.leftItems.length;
                    for (let i = 0; i < totalPairs; i++) {
                        if (userAns[i] === q.correctMap[i]) matches++;
                    }
                    const earned = matches === totalPairs ? 2 : (matches === 1 ? 1 : 0);
                    return {
                        earned,
                        max: q.maxPoints,
                        status: earned === 2 ? 'correct' : (earned === 1 ? 'partial' : 'wrong')
                    };
                }

                if (q.type === 'multiple') {
                    if (!Array.isArray(userAns) || userAns.length === 0) {
                        return { earned: 0, max: q.maxPoints, status: 'wrong' };
                    }
                    const correctSet = new Set(q.correctIndices);
                    let rightSelected = 0;
                    let wrongSelected = 0;

                    userAns.forEach(idx => {
                        if (correctSet.has(idx)) rightSelected++;
                        else wrongSelected++;
                    });

                    let earned = 0;
                    if (wrongSelected === 0 && rightSelected === correctSet.size) {
                        earned = 2; // Идеально
                    } else if ((wrongSelected === 0 && rightSelected === correctSet.size - 1) || (wrongSelected === 1 && rightSelected === correctSet.size)) {
                        earned = 1; // 1 ошибка по правилам НЦТ
                    }

                    return {
                        earned,
                        max: q.maxPoints,
                        status: earned === 2 ? 'correct' : (earned === 1 ? 'partial' : 'wrong')
                    };
                }

                return { earned: 0, max: q.maxPoints, status: 'wrong' };
            },

            /**
             * ============================================================================
             * 4. РЕНДЕРИНГ ИНТЕРФЕЙСА
             * ============================================================================
             */
            render() {
                const root = document.getElementById('app-root');
                if (this.state.view === 'home') {
                    root.innerHTML = this.renderHome();
                } else if (this.state.view === 'variants') {
                    root.innerHTML = this.renderVariants();
                } else if (this.state.view === 'test') {
                    root.innerHTML = this.renderTest();
                } else if (this.state.view === 'results') {
                    root.innerHTML = this.renderResults();
                }
            },

            // ЭКРАН 1: Выбор предмета
            renderHome() {
                const mandatory = SUBJECTS.filter(s => s.category === 'Обязательный');

                const renderCard = (sub) => `

                                <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-indigo-50 text-indigo-700">${sub.qCount} заданий • ${sub.maxScore} б.</span>
                            </div>
                            <h3 class="font-bold text-lg text-slate-900 group-hover:text-indigo-600 transition-colors mb-1.5">${sub.name}</h3>
                            <p class="text-xs text-slate-500 leading-relaxed mb-4">${sub.desc}</p>
                        </div>
                        <div class="pt-3 border-t border-slate-100 flex items-center justify-between text-xs font-medium text-slate-600">
                            <span>10 вариантов НЦТ</span>
                            <span class="text-indigo-600 font-semibold group-hover:translate-x-1 transition-transform">Выбрать →</span>
                        </div>
                    </div>
                `;

                return `
                    <div class="fade-in space-y-8">
                        <!-- Баннер приветствия -->
                        <div class="bg-gradient-to-br from-indigo-600 via-indigo-700 to-blue-800 rounded-3xl p-6 sm:p-10 text-white shadow-xl shadow-indigo-200/60 relative overflow-hidden">
                            <div class="relative z-10 max-w-2xl">
                                <span class="inline-block px-3 py-1 rounded-full bg-white/15 backdrop-blur-sm text-xs font-semibold tracking-wide uppercase mb-3">
                                    Подготовка к ЕНТ • Формат 2026–2027
                                </span>
                                <h2 class="text-2xl sm:text-4xl font-extrabold tracking-tight mb-3">
                                    Проверь свои знания и закрой пробелы перед экзаменом
                                </h2>
                                <p class="text-indigo-100 text-sm sm:text-base leading-relaxed mb-6">
                                    Выбери любой предмет и пройди один из 10 вариантов. После завершения ты получишь точный подсчет баллов, пошаговую логику решения и список тем с указанием класса для каждой ошибки.
                                </p>
                                <div class="flex flex-wrap gap-3 text-xs font-medium">
                                    <span class="bg-white/10 px-3 py-1.5 rounded-lg">✓ Одиночный выбор (1 балл)</span>
                                    <span class="bg-white/10 px-3 py-1.5 rounded-lg">✓ Контекстные задания</span>
                                    <span class="bg-white/10 px-3 py-1.5 rounded-lg">✓ Соответствие и множественный выбор (2 балла)</span>

                        <!-- Обязательные предметы -->
                        <section>
                            <div class="flex items-center gap-2 mb-4">
                                <span class="w-2.5 h-6 bg-amber-500 rounded-full"></span>
                                <h3 class="text-xl font-bold text-slate-900">Обязательные предметы (Единый блок)</h3>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                ${mandatory.map(renderCard).join('')}
                            </div>
                        </section>

                        <!-- Профильные предметы -->
                        <section>
                            <div class="flex items-center gap-2 mb-4">
                                <span class="w-2.5 h-6 bg-indigo-600 rounded-full"></span>

            },

            // ЭКРАН 2: Выбор варианта (1–10)
            renderVariants() {

                for (let v = 1; v <= 10; v++) {
                    variantCards += `
                        <button onclick="app.startTest(${v})"

                                    <p class="text-sm text-slate-500 mt-1">${sub.desc}</p>
                                </div>
                            </div>
                        </div>

                        <h3 class="text-lg font-bold text-slate-900 mb-4">Выберите вариант для прохождения:</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
                            ${variantCards}
                        </div>
                    </div>
                `;
            },

            // ЭКРАН 3: Прохождение тестирования
            renderTest() {
                const sub = this.state.selectedSubject;
                const variant = this.state.selectedVariant;
                const questions = this.state.questions;
                const idx = this.state.currentQuestionIndex;
                const q = questions[idx];
                const userAns = this.state.userAnswers[q.id];

                // Навигационная палитра вопросов
                const navButtons = questions.map((item, i) => {
                    const isAnswered = this.state.userAnswers[item.id] !== undefined && 
                        (!Array.isArray(this.state.userAnswers[item.id]) || this.state.userAnswers[item.id].length > 0);
                    const isCurrent = i === idx;
                    let cls = 'bg-white text-slate-700 border-slate-200 hover:border-indigo-400';
                    if (isCurrent) cls = 'bg-indigo-600 text-white border-indigo-600 ring-2 ring-indigo-200';
                    else if (isAnswered) cls = 'bg-emerald-50 text-emerald-700 border-emerald-300 font-bold';

                    return `<button onclick="app.state.currentQuestionIndex = ${i}; app.render();" class="w-10 h-10 rounded-xl border text-sm font-semibold transition flex items-center justify-center ${cls}">${i + 1}</button>`;
                }).join('');

                // Рендер области ответа в зависимости от типа задания
                let answerHtml = '';
                const letters = ['A', 'B', 'C', 'D', 'E', 'F'];

                if (q.type === 'single' || q.type === 'context') {
                    answerHtml = `
                        <div class="space-y-3">
                            ${q.options.map((opt, oIdx) => {
                                const selected = userAns === oIdx;
                                return `
                                    <div onclick="app.handleSingleAnswer(${q.id}, ${oIdx})"
                                         class="p-4 rounded-2xl border-2 cursor-pointer transition-all flex items-center gap-3.5 ${selected ? 'border-indigo-600 bg-indigo-50/70 shadow-sm' : 'border-slate-200 bg-white hover:border-indigo-300 hover:bg-slate-50'}">
                                        <div class="w-8 h-8 rounded-lg flex items-center justify-center font-bold text-sm shrink-0 ${selected ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'}">
                                            ${letters[oIdx]}
                                        </div>
                                        <div class="text-sm sm:text-base font-medium text-slate-800">${opt}</div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `;
                } else if (q.type === 'multiple') {
                    const selectedArr = Array.isArray(userAns) ? userAns : [];
                    answerHtml = `
                        <div class="mb-3 text-xs font-semibold text-indigo-700 bg-indigo-50 px-3 py-2 rounded-xl inline-block">
                            Задание с множественным выбором (отметьте от 1 до 3 правильных вариантов • макс. 2 балла)
                        </div>
                        <div class="space-y-3">
                            ${q.options.map((opt, oIdx) => {
                                const selected = selectedArr.includes(oIdx);
                                return `
                                    <div onclick="app.handleMultipleAnswer(${q.id}, ${oIdx})"
                                         class="p-4 rounded-2xl border-2 cursor-pointer transition-all flex items-center gap-3.5 ${selected ? 'border-indigo-600 bg-indigo-50/70 shadow-sm' : 'border-slate-200 bg-white hover:border-indigo-300 hover:bg-slate-50'}">
                                        <div class="w-6 h-6 rounded-md border-2 flex items-center justify-center shrink-0 ${selected ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-300 bg-white'}">
                                            ${selected ? '✓' : ''}
                                        </div>
                                        <div class="w-7 h-7 rounded-lg flex items-center justify-center font-bold text-xs shrink-0 ${selected ? 'bg-indigo-100 text-indigo-700' : 'bg-slate-100 text-slate-600'}">
                                            ${letters[oIdx]}
                                        </div>
                                        <div class="text-sm sm:text-base font-medium text-slate-800">${opt}</div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `;
                } else if (q.type === 'matching') {
                    const currentMap = userAns || {};
                    answerHtml = `
                        <div class="mb-4 text-xs font-semibold text-indigo-700 bg-indigo-50 px-3 py-2 rounded-xl inline-block">
                            Задание на установление соответствия (выберите пару для каждого элемента • макс. 2 балла)
                        </div>
                        <div class="space-y-4">
                            ${q.leftItems.map((leftText, lIdx) => `
                                <div class="p-4 rounded-2xl border border-slate-200 bg-slate-50/70 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                    <div class="font-semibold text-sm sm:text-base text-slate-800">${leftText}</div>
                                    <select onchange="app.handleMatchingAnswer(${q.id}, ${lIdx}, this.value)"
                                            class="bg-white border-2 border-slate-300 focus:border-indigo-600 rounded-xl px-3.5 py-2.5 text-sm font-medium text-slate-800 outline-none sm:w-72">
                                        <option value="" disabled ${currentMap[lIdx] === undefined ? 'selected' : ''}>— Выберите соответствие —</option>
                                        ${q.rightOptions.map((rOpt, rIdx) => `
                                            <option value="${rIdx}" ${currentMap[lIdx] === rIdx ? 'selected' : ''}>${rOpt}</option>
                                        `).join('')}
                                    </select>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }

                return `
                    <div class="fade-in max-w-4xl mx-auto space-y-6">
                        <!-- Шапка теста -->
                        <div class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200 shadow-sm flex flex-wrap items-center justify-between gap-4">
                            <div>
                                <div class="text-xs font-semibold text-slate-500">${sub.name} • Вариант №${variant}</div>
                                <div class="text-base sm:text-lg font-bold text-slate-900">Вопрос ${idx + 1} из ${questions.length}</div>
                            </div>
                            <div class="flex items-center gap-3">
                                <div class="px-3.5 py-2 rounded-xl bg-slate-100 text-slate-700 font-mono text-sm font-bold flex items-center gap-2">
                                    <span>⏱</span>
                                    <span id="test-timer">${this.formatTime(this.state.timerSeconds)}</span>
                                </div>
                                <button onclick="app.confirmFinishTest()" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold shadow-sm transition">
                                    Завершить тест
                                </button>
                            </div>
                        </div>

                        <!-- Навигация по номерам заданий -->
                        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                            <div class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2.5 flex flex-wrap items-center justify-between gap-2">
                                <span>Навигация по заданиям (${questions.length} вопросов • макс. ${sub.maxScore} баллов):</span>
                                <span class="text-indigo-600">
                                    ${sub.qCount === 40 ? '№1–25: 1 балл • №26–30: Контекст • №31–35: Соответствие (2 б.) • №36–40: Множ. выбор (2 б.)' : ''}
                                </span>
                            </div>
                            <div class="flex flex-wrap gap-1.5">
                                ${navButtons}
                            </div>
                        </div>

                        <!-- Карточка текущего вопроса -->
                        <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm">
                            <div class="flex items-center justify-between gap-2 mb-4">
                                <span class="text-xs font-bold uppercase tracking-wider px-2.5 py-1 rounded-lg bg-slate-100 text-slate-600">
                                    ${q.type === 'context' ? 'Контекстное задание' : q.type === 'matching' ? 'Соответствие' : q.type === 'multiple' ? 'Множественный выбор' : 'Одиночный выбор'}
                                </span>
                                <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-lg">
                                    Макс. балл: ${q.maxPoints}
                                </span>
                            </div>

                            ${q.context ? `
                                <div class="p-4 sm:p-5 rounded-2xl bg-amber-50/80 border border-amber-200 text-slate-800 text-sm sm:text-base leading-relaxed mb-6 whitespace-pre-line">
                                    ${q.context}
                                </div>
                            ` : ''}

                            <h3 class="text-lg sm:text-xl font-bold text-slate-900 mb-6 leading-snug">
                                ${q.text}
                            </h3>

                            ${answerHtml}

                            <!-- Кнопки Вперед / Назад -->
                            <div class="mt-8 pt-6 border-t border-slate-100 flex items-center justify-between">
                                <button onclick="app.state.currentQuestionIndex = Math.max(0, ${idx} - 1); app.render();"
                                        ${idx === 0 ? 'disabled' : ''}
                                        class="px-5 py-2.5 rounded-xl text-sm font-semibold border border-slate-200 text-slate-700 hover:bg-slate-50 disabled:opacity-40 disabled:pointer-events-none transition">
                                    ← Предыдущий
                                </button>

                                ${idx < questions.length - 1 ? `
                                    <button onclick="app.state.currentQuestionIndex = ${idx} + 1; app.render();"
                                            class="px-6 py-2.5 rounded-xl text-sm font-bold bg-indigo-600 hover:bg-indigo-700 text-white shadow-sm transition">
                                        Следующий вопрос →
                                    </button>
                                ` : `
                                    <button onclick="app.confirmFinishTest()"
                                            class="px-6 py-2.5 rounded-xl text-sm font-bold bg-emerald-600 hover:bg-emerald-700 text-white shadow-sm transition">
                                        Завершить и узнать баллы ✓
                                    </button>
                                `}
                            </div>
                        </div>
                    </div>
                `;
            },

            // ЭКРАН 4: Подробные результаты и умный разбор ошибок
            renderResults() {
                const sub = this.state.selectedSubject;
                const variant = this.state.selectedVariant;
                const questions = this.state.questions;

                let totalEarned = 0;
                let totalMax = 0;
                const weakTopics = [];

                const evaluatedList = questions.map((q, idx) => {
                    const userAns = this.state.userAnswers[q.id];
                    const res = this.evaluateQuestion(q, userAns);
                    totalEarned += res.earned;
                    totalMax += res.max;

                    if (res.status !== 'correct') {
                        weakTopics.push({ grade: q.grade, topic: q.topic, qNum: idx + 1 });
                    }
                    return { q, idx, userAns, res };
                });

                const percentage = Math.round((totalEarned / totalMax) * 100);
                const letters = ['A', 'B', 'C', 'D', 'E', 'F'];

                // Форматирование ответа пользователя и правильного ответа для отображения
                const formatAnswersComparison = (q, userAns) => {
                    if (q.type === 'single' || q.type === 'context') {
                        const uText = userAns !== undefined ? `${letters[userAns]}) ${q.options[userAns]}` : 'Нет ответа';
                        const cText = `${letters[q.correct]}) ${q.options[q.correct]}`;
                        return { uText, cText };
                    }
                    if (q.type === 'multiple') {
                        const uText = Array.isArray(userAns) && userAns.length > 0
                            ? userAns.sort().map(i => `${letters[i]}) ${q.options[i]}`).join('; ')
                            : 'Нет ответа';
                        const cText = q.correctIndices.map(i => `${letters[i]}) ${q.options[i]}`).join('; ');
                        return { uText, cText };
                    }
                    if (q.type === 'matching') {
                        const uText = userAns
                            ? q.leftItems.map((l, i) => `${l.split(')')[0]} → ${userAns[i] !== undefined ? q.rightOptions[userAns[i]] : 'не выбрано'}`).join('; ')
                            : 'Нет ответа';
                        const cText = q.leftItems.map((l, i) => `${l.split(')')[0]} → ${q.rightOptions[q.correctMap[i]]}`).join('; ');
                        return { uText, cText };
                    }
                    return { uText: '', cText: '' };
                };

                return `
                    <div class="fade-in max-w-4xl mx-auto space-y-8">
                        <!-- Итоговая сводка баллов -->
                        <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm">
                            <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 pb-6 border-b border-slate-100">
                                <div>
                                    <span class="inline-block px-3 py-1 rounded-full bg-indigo-50 text-indigo-700 text-xs font-bold mb-2">
                                        Результаты тестирования • Вариант №${variant}
                                    </span>
                                    <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900">${sub.name}</h2>
                                    <p class="text-sm text-slate-500 mt-1">Затраченное время: <span class="font-semibold text-slate-700">${this.formatTime(this.state.timerSeconds)}</span></p>
                                </div>

                                <div class="flex items-center gap-5 bg-slate-50 p-4 rounded-2xl border border-slate-200/80">
                                    <div class="text-center">
                                        <div class="text-3xl sm:text-4xl font-black text-indigo-600">${totalEarned} <span class="text-lg font-bold text-slate-400">/ ${totalMax}</span></div>
                                        <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mt-0.5">Набрано баллов</div>
                                    </div>
                                    <div class="h-10 w-px bg-slate-200"></div>
                                    <div class="text-center">
                                        <div class="text-2xl sm:text-3xl font-extrabold ${percentage >= 70 ? 'text-emerald-600' : percentage >= 40 ? 'text-amber-500' : 'text-rose-600'}">${percentage}%</div>
                                        <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mt-0.5">Уровень</div>
                                    </div>
                                </div>
                            </div>

                            <!-- План повторения (если были ошибки) -->
                            <div class="mt-6">
                                ${weakTopics.length > 0 ? `
                                    <div class="bg-rose-50/70 border border-rose-200 rounded-2xl p-5">
                                        <h3 class="text-base font-bold text-rose-900 flex items-center gap-2 mb-3">
                                            <span>🎯</span> Персональный план повторения (на основе ваших ошибок):
                                        </h3>
                                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                                            ${weakTopics.map(wt => `
                                                <div class="bg-white p-3 rounded-xl border border-rose-100 flex items-start gap-2.5 text-xs">
                                                    <span class="px-2 py-0.5 rounded bg-rose-100 text-rose-800 font-bold shrink-0">${wt.grade}</span>
                                                    <div>
                                                        <div class="font-bold text-slate-800">${wt.topic}</div>
                                                        <div class="text-slate-500">Ошибка в задании №${wt.qNum}</div>
                                                    </div>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                ` : `
                                    <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-5 text-emerald-900 flex items-center gap-3">
                                        <span class="text-2xl">🏆</span>
                                        <div>
                                            <div class="font-bold text-base">Безупречный результат!</div>
                                            <div class="text-xs text-emerald-700">Вы правильно решили все задания варианта без единой ошибки. Попробуйте следующий вариант!</div>
                                        </div>
                                    </div>
                                `}
                            </div>

                            <div class="mt-6 flex flex-wrap gap-3">
                                <button onclick="app.selectSubject('${sub.id}')" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold shadow-sm transition">
                                    Выбрать другой вариант
                                </button>
                                <button onclick="app.startTest(${variant})" class="px-5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold transition">
                                    Пройти вариант №${variant} заново
                                </button>
                            </div>
                        </div>

                        <!-- Детальный разбор каждого задания -->
                        <div class="space-y-5">
                            <h3 class="text-xl font-bold text-slate-900">Подробный разбор каждого задания и логика решения</h3>

                            ${evaluatedList.map(({ q, idx, userAns, res }) => {
                                const { uText, cText } = formatAnswersComparison(q, userAns);
                                const isCorrect = res.status === 'correct';
                                const isPartial = res.status === 'partial';

                                const badgeClass = isCorrect
                                    ? 'bg-emerald-100 text-emerald-800 border-emerald-200'
                                    : isPartial
                                        ? 'bg-amber-100 text-amber-800 border-amber-200'
                                        : 'bg-rose-100 text-rose-800 border-rose-200';

                                const badgeText = isCorrect
                                    ? `Верно (+${res.earned} из ${res.max} б.)`
                                    : isPartial
                                        ? `Частично верно (+${res.earned} из ${res.max} б.)`
                                        : `Ошибка (0 из ${res.max} б.)`;

                                return `
                                    <div class="bg-white rounded-3xl p-6 border ${isCorrect ? 'border-slate-200' : 'border-rose-200'} shadow-sm">
                                        <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                                            <span class="font-extrabold text-base text-slate-900">Задание №${idx + 1}</span>
                                            <span class="text-xs font-bold px-3 py-1 rounded-full border ${badgeClass}">
                                                ${badgeText}
                                            </span>
                                        </div>

                                        <p class="text-sm sm:text-base font-semibold text-slate-800 mb-4">${q.text}</p>

                                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4 text-xs sm:text-sm">
                                            <div class="p-3.5 rounded-2xl ${isCorrect ? 'bg-emerald-50/70 border border-emerald-200' : 'bg-rose-50/70 border border-rose-200'}">
                                                <div class="font-bold text-slate-500 text-xs uppercase mb-1">Ваш ответ:</div>
                                                <div class="font-semibold ${isCorrect ? 'text-emerald-900' : 'text-rose-900'}">${uText}</div>
                                            </div>
                                            <div class="p-3.5 rounded-2xl bg-emerald-50/70 border border-emerald-200">
                                                <div class="font-bold text-slate-500 text-xs uppercase mb-1">Правильный ответ:</div>
                                                <div class="font-semibold text-emerald-900">${cText}</div>
                                            </div>
                                        </div>

                                        <!-- Блок логики решения -->
                                        <div class="bg-slate-50 rounded-2xl p-4 sm:p-5 border border-slate-200/80 space-y-3">
                                            <div class="text-xs font-extrabold uppercase tracking-wider text-indigo-600 flex items-center gap-1.5">
                                                <span>💡</span> Логика и ход решения:
                                            </div>
                                            <p class="text-xs sm:text-sm text-slate-700 leading-relaxed whitespace-pre-line">${q.explanation}</p>

                                            ${!isCorrect ? `
                                                <div class="pt-3 border-t border-slate-200 flex flex-wrap items-center gap-2 text-xs">
                                                    <span class="font-bold text-rose-700">📚 Что повторить:</span>
                                                    <span class="px-2.5 py-1 rounded-lg bg-amber-100 text-amber-900 font-bold">${q.grade}</span>
                                                    <span class="px-2.5 py-1 rounded-lg bg-white border border-slate-200 text-slate-800 font-semibold">Тема: «${q.topic}»</span>
                                                </div>
                                            ` : `
                                                <div class="pt-2 text-xs text-slate-500">
                                                    Раздел программы: <span class="font-semibold text-slate-700">${q.grade} • ${q.topic}</span>
                                                </div>
                                            `}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }
        };

        // Инициализация приложения при загрузке страницы
        window.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
    </script>
</body>
</html>
